name: Build Neon Defender APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libltdl-dev libssl-dev build-essential gettext autopoint

      - name: Install Android build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.6.0" "python-for-android==2026.5.9" "cython==0.29.34"

      - name: Clean previous Android build
        run: |
          rm -rf .buildozer bin ~/.buildozer/android/platform/build-*

      - name: Prepare libtool/autotools
        run: |
          libtoolize --force --copy
          aclocal
          autoreconf --force --install --verbose || true

      - name: Build debug APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          yes | buildozer -v android debug

      - name: Verify APK
        run: |
          find bin -maxdepth 1 -type f -name '*.apk' -print
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonDefender-APK
          path: bin/*.apk
          if-no-files-found: error
